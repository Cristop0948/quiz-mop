<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF3F3;--surface:#FFFFFF;--ink:#10262B;--muted:#4F676C;--line:#CFDDDF;--brine:#0F7F8C;--on-brine:#FFFFFF;--brine-soft:#D5ECEE;--bad:#B63E2E;--t0:#C4402F;--t1:#1D66A8;--t2:#E0A21F;--t3:#3A8745;--focus:#D8961A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B191D;--surface:#122529;--ink:#E4EFF0;--muted:#98AEB2;--line:#21393F;--brine:#39B3C0;--on-brine:#06262B;--brine-soft:#12363C;--bad:#C94B3A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B191D;--surface:#122529;--ink:#E4EFF0;--muted:#98AEB2;--line:#21393F;--brine:#39B3C0;--on-brine:#06262B;--brine-soft:#12363C;--bad:#C94B3A;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.app{max-width:560px;height:100%;margin:0 auto;padding:16px 18px;display:flex;flex-direction:column}
h1{font:800 44px/.95 "Barlow Condensed",sans-serif;margin:24px 0 10px}
.lead{color:var(--muted);margin:0 0 22px}
.lbl{display:block;font-weight:600;margin:0 0 6px}
input{width:100%;height:60px;border:2px solid var(--line);border-radius:12px;padding:0 16px;font:600 26px "Barlow Condensed",sans-serif;background:var(--surface);color:var(--ink);letter-spacing:1px}
.btn{display:block;width:100%;min-height:60px;margin-top:18px;border:0;border-radius:12px;background:var(--brine);color:var(--on-brine);font:800 24px/1 "Barlow Condensed",sans-serif;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:2px solid var(--line)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.err{color:var(--bad);font-weight:600;min-height:1.5em;margin:10px 0 0}
.nombres{display:grid;gap:8px;margin:12px 0 0;overflow-y:auto;flex:1;min-height:120px;padding-bottom:4px;align-content:start}
.nombres button{min-height:58px;text-align:left;padding:0 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:600 24px "Barlow Condensed",sans-serif;cursor:pointer}
.nombres button.sel{border-color:var(--brine);background:var(--brine-soft)}
.link{background:none;border:0;color:var(--brine);font:600 18px Barlow,sans-serif;text-decoration:underline;padding:12px 0;cursor:pointer;text-align:left}
.pie{padding-top:8px;background:var(--bg)}
input.buscar{font:600 22px Barlow,sans-serif;letter-spacing:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;font:600 18px "Barlow Condensed",sans-serif;color:var(--muted)}
.bar button{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:8px}
.hint{text-align:center;margin:8px 0 12px;font-size:17px}
.pad{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;min-height:340px}
.pad button{border:0;border-radius:18px;display:grid;place-items:center;cursor:pointer;transition:transform .08s}
.pad button:active{transform:scale(.96)}
.pad svg{width:42%;max-width:110px;fill:#fff}
.c0{background:var(--t0)}.c1{background:var(--t1)}.c2{background:var(--t2)}.c3{background:var(--t3)}
.c2 svg,.sent .c2 svg{fill:#2A1C00}
.sent{flex:1;display:grid;place-items:center;text-align:center;align-content:center;gap:12px}
.sent .shape{width:140px;height:140px;border-radius:24px;display:grid;place-items:center;margin:0 auto}
.sent .shape svg{width:60%;fill:#fff}
.sent h2{font:800 40px/1 "Barlow Condensed",sans-serif;margin:8px 0 0}
.demo{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* Esta página no contiene preguntas, respuestas ni nombres: solo envía toques al Form. */
const DEMO = false;
const qs = new URLSearchParams(location.search);
const CFG = {pin: qs.get('s') || '', f: qs.get('f') || '', e: (qs.get('e') || '').split(',')};
/* La lista de nombres viaja en el QR después del "#": nunca se envía a GitHub ni queda en esta página. */
const LISTA = (new URLSearchParams(location.hash.slice(1)).get('n') || '').split('~').map(x => x.replace(/_/g, ' ').trim()).filter(Boolean);
const FORM = CFG.f ? `https://docs.google.com/forms/d/e/${CFG.f}/formResponse` : '';
const listo = DEMO || (FORM && CFG.e.length === 4 && CFG.e.every(x => /^\d+$/.test(x)));

const $ = s => document.querySelector(s), app = $('#app');
const wait = ms => new Promise(r => setTimeout(r, ms));
const SH = [
  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 22 20H2z"/></svg>',
  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 22 12 12 22 2 12z"/></svg>',
  '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/></svg>',
  '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>'
];
const NOMBRES = ['Rojo triángulo', 'Azul rombo', 'Amarillo círculo', 'Verde cuadrado'];

let ac = null;
function tone(f, d, v) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const vibrar = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

const S = {pin: CFG.pin, jugador: '', nombre: '', sel: -1, enviando: false};
try { const g = JSON.parse(localStorage.getItem('quiz-sala') || '{}'); if (g.pin && g.pin === S.pin) { S.jugador = g.jugador; S.nombre = g.nombre; } } catch (e) {}
const norm = x => x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const esc = x => String(x).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function enviar(tipo, opcion) {
  if (DEMO) { await wait(300); return true; }
  const body = new URLSearchParams();
  [S.pin, S.jugador, tipo, opcion].forEach((v, i) => body.append('entry.' + CFG.e[i], v));
  for (let i = 0; i < 3; i++) {
    try { await fetch(FORM, {method: 'POST', mode: 'no-cors', body}); return true; }
    catch (e) { await wait(800 * (i + 1)); }
  }
  return false;
}

function scrError() {
  app.innerHTML = `<h1>Este link está incompleto</h1><p class="lead">Escanea el código QR que aparece en la pantalla de la sala.</p>`;
}

function pinInput() {
  return S.pin ? '' : '<label class="lbl" for="pin">PIN de la sala</label><input id="pin" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="482915" style="margin-bottom:14px">';
}

function scrUnirse(msg) {
  if (!LISTA.length) return scrEscribir(msg);
  S.sel = -1;
  app.innerHTML = `<h1>¿Quién eres?</h1>
    ${pinInput()}
    <input id="bu" class="buscar" autocomplete="off" placeholder="Busca tu nombre" aria-label="Busca tu nombre">
    <div class="nombres" id="lista"></div>
    <div class="pie"><p class="err" id="err" role="alert">${msg || ''}</p>
      <button class="btn" id="go">Elige tu nombre</button>
      <button class="link" id="no">No estoy en la lista</button>
      ${DEMO ? '<p class="demo">Demostración: no se envía nada.</p>' : ''}</div>`;
  const pintar = () => {
    const v = norm($('#bu').value.trim());
    $('#lista').innerHTML = LISTA.map((n, i) => ({n, i})).filter(x => !v || norm(x.n).includes(v))
      .map(x => `<button data-i="${x.i}" class="${x.i === S.sel ? 'sel' : ''}" aria-pressed="${x.i === S.sel}">${esc(x.n)}</button>`).join('')
      || '<p class="lead">No aparece. Toca "No estoy en la lista".</p>';
    $('#lista').querySelectorAll('button').forEach(b => b.onclick = () => {
      S.sel = +b.dataset.i; $('#err').textContent = '';
      $('#go').textContent = `Entrar como ${LISTA[S.sel]}`; pintar();
    });
  };
  $('#bu').oninput = pintar;
  $('#no').onclick = () => scrEscribir();
  $('#go').onclick = () => {
    if (S.sel < 0) { $('#err').textContent = 'Toca tu nombre en la lista.'; return; }
    unirse('i:' + S.sel, LISTA[S.sel]);
  };
  pintar();
}

function scrEscribir(msg) {
  app.innerHTML = `<h1>Escribe tu nombre</h1>
    <p class="lead">Nombre y apellido, para que el jefe de turno te reconozca.</p>
    ${pinInput()}
    <input id="nm" class="buscar" autocomplete="name" maxlength="60" placeholder="Nombre y apellido" aria-label="Nombre y apellido">
    <p class="err" id="err" role="alert">${msg || ''}</p>
    <button class="btn" id="go">Unirme</button>
    ${LISTA.length ? '<button class="link" id="vl">Volver a la lista</button>' : ''}
    ${DEMO ? '<p class="demo">Demostración: no se envía nada.</p>' : ''}`;
  $('#nm').oninput = () => $('#err').textContent = '';
  if ($('#vl')) $('#vl').onclick = () => scrUnirse();
  $('#go').onclick = () => {
    const n = $('#nm').value.trim().replace(/\s+/g, ' ');
    if (n.split(' ').length < 2) { $('#err').textContent = 'Escribe tu nombre y tu apellido.'; return; }
    unirse('t:' + n, n);
  };
}

async function unirse(jugador, nombre) {
  const pin = S.pin || ($('#pin') ? $('#pin').value.trim() : '');
  if (!/^\d{6}$/.test(pin)) { $('#err').textContent = 'El PIN tiene 6 números. Míralo en la pantalla.'; return; }
  S.pin = pin; S.jugador = jugador; S.nombre = nombre;
  const go = $('#go'); go.disabled = true; go.textContent = 'Entrando…';
  tone(880, .1, .12);
  if (!await enviar('join', '')) { go.disabled = false; go.textContent = 'Reintentar'; $('#err').textContent = 'No hay señal. Revisa tu conexión y vuelve a intentar.'; return; }
  try { localStorage.setItem('quiz-sala', JSON.stringify({pin: S.pin, jugador: S.jugador, nombre: S.nombre})); } catch (e) {}
  scrPad('Busca tu nombre en la pantalla. Cuando aparezca la pregunta, toca tu respuesta.');
}

function scrPad(hint) {
  app.innerHTML = `<div class="bar"><span>${esc(S.nombre)}</span><button id="salir">No soy yo</button></div>
    <p class="hint">${hint || 'Toca la figura de la respuesta que ves en la pantalla.'}</p>
    <div class="pad">${SH.map((s, k) => `<button class="c${k}" data-k="${k}" aria-label="${NOMBRES[k]}">${s}</button>`).join('')}</div>
    ${DEMO ? '<p class="demo">Demostración: no se envía nada.</p>' : ''}`;
  app.querySelectorAll('.pad button').forEach(b => b.onclick = () => responder(+b.dataset.k));
  $('#salir').onclick = () => { try { localStorage.removeItem('quiz-sala'); } catch (e) {} S.jugador = ''; S.nombre = ''; scrUnirse(); };
}

async function responder(k) {
  if (S.enviando) return;
  S.enviando = true;
  tone(660 + k * 110, .12, .14); vibrar(40);
  app.innerHTML = `<div class="sent"><div class="shape c${k}">${SH[k]}</div><h2>Enviando…</h2></div>`;
  const ok = await enviar('resp', String(k));
  if (!ok) {
    S.enviando = false;
    app.innerHTML = `<div class="sent"><div class="shape c${k}">${SH[k]}</div><h2>No se pudo enviar</h2><p class="lead">Revisa tu señal.</p><button class="btn" id="re">Reintentar</button><button class="btn sec" id="vo">Volver</button></div>`;
    $('#re').onclick = () => responder(k);
    $('#vo').onclick = () => scrPad();
    return;
  }
  app.querySelector('h2').textContent = 'Enviado';
  app.querySelector('.sent').insertAdjacentHTML('beforeend', '<p class="lead">Mira la pantalla. En cada pregunta cuenta solo tu primera respuesta.</p>');
  await wait(2500);
  S.enviando = false;
  scrPad('Espera la siguiente pregunta y toca tu respuesta.');
}

if (!listo) scrError();
else if (S.jugador) scrPad();
else scrUnirse();
</script>
</body>
</html>
